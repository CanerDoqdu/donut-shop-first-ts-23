name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ─── Lint ────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint

  # ─── Type-check ─────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck

  # ─── Test ────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm test -- --coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─── Security Audit ─────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high

  # ─── Build ──────────────────────────────────────────────────
  build:
    name: Build (PR-safe)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_placeholder' }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET || 'whsec_placeholder' }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 're_placeholder_dummy' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}

      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 7

  # ─── Real Secret Integration Check (main only) ─────────────
  build-with-secrets:
    name: Build (Real Secrets)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Ensure required secrets exist
        run: |
          test -n "${NEXT_PUBLIC_SUPABASE_URL}" || (echo "Missing NEXT_PUBLIC_SUPABASE_URL" && exit 1)
          test -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY}" || (echo "Missing NEXT_PUBLIC_SUPABASE_ANON_KEY" && exit 1)
          test -n "${SUPABASE_SERVICE_ROLE_KEY}" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)
          test -n "${STRIPE_SECRET_KEY}" || (echo "Missing STRIPE_SECRET_KEY" && exit 1)
          test -n "${STRIPE_WEBHOOK_SECRET}" || (echo "Missing STRIPE_WEBHOOK_SECRET" && exit 1)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

  # ─── Bundle Size Check ─────────────────────────────────────
  bundle-analysis:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    needs: [build]
    # Optional: only when PR labeled ci:perf
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:perf')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build with bundle analyzer
        run: ANALYZE=true npm run build 2>&1 | tee build-output.txt
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_placeholder' }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET || 'whsec_placeholder' }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 're_placeholder_dummy' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}

      - name: Bundle size gate
        run: |
          # Gate: total client JS under 5MB
          TOTAL_JS=$(find .next/static -name '*.js' -exec wc -c {} + 2>/dev/null | tail -1 | awk '{print $1}')
          echo "Total client JS: ${TOTAL_JS:-0} bytes"
          if [ "${TOTAL_JS:-0}" -gt 5242880 ]; then
            echo "::error::Client JS exceeds 5MB budget (${TOTAL_JS} bytes)"
            exit 1
          fi
          echo "Bundle size gate passed"

  # ─── Lighthouse CI ─────────────────────────────────────────
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [build]
    # Optional: only when PR labeled ci:perf
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:perf')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm install -g @lhci/cli@0.14.x

      - name: Build for Lighthouse
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder-anon-key'
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
          SUPABASE_SERVICE_ROLE_KEY: 'placeholder-service-key'
          STRIPE_SECRET_KEY: 'sk_test_placeholder'
          STRIPE_WEBHOOK_SECRET: 'whsec_placeholder'
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: 'pk_test_placeholder'
          RESEND_API_KEY: 're_placeholder_dummy'
          NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'

      - name: Run Lighthouse CI
        run: |
          lhci autorun --config=lighthouserc.json || true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN || '' }}

  # ─── Security Scan ──────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Dependency audit (high + critical)
        run: npm audit --audit-level=high --omit=dev

      - name: Secret scan (source files)
        run: |
          echo "Scanning for hardcoded secrets…"
          FOUND=0
          # Exclude security-baseline files (they define/test the scan patterns, not real secrets)
          EXCLUDES="--exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git --exclude=*security-baseline*"
          # Stripe secret keys
          if grep -rn 'sk_live_[A-Za-z0-9]\{20,\}' --include='*.ts' --include='*.tsx' --include='*.js' --include='*.json' $EXCLUDES .; then
            echo "::error::Found Stripe live secret key in source"
            FOUND=1
          fi
          # PEM private keys
          if grep -rn 'BEGIN.*PRIVATE KEY' --include='*.ts' --include='*.tsx' --include='*.js' --include='*.json' --include='*.pem' $EXCLUDES .; then
            echo "::error::Found PEM private key in source"
            FOUND=1
          fi
          # Webhook secrets (live)
          if grep -rn 'whsec_[A-Za-z0-9]\{20,\}' --include='*.ts' --include='*.tsx' --include='*.js' $EXCLUDES .; then
            echo "::error::Found Stripe webhook secret in source"
            FOUND=1
          fi
          if [ "$FOUND" -ne 0 ]; then
            exit 1
          fi
          echo "No hardcoded secrets found ✓"

      - name: Forbidden pattern scan
        run: |
          echo "Scanning for forbidden patterns…"
          FOUND=0
          EXCLUDES="--exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git --exclude-dir=tests --exclude-dir=e2e --exclude=*security-baseline*"
          # eval() in production code (exclude tests, node_modules, configs)
          if grep -rn '\beval\s*(' --include='*.ts' --include='*.tsx' $EXCLUDES -- lib/ app/ components/ hooks/ store/; then
            echo "::warning::Found eval() usage in production code"
            FOUND=1
          fi
          # document.write in production code
          if grep -rn 'document\.write\s*(' --include='*.ts' --include='*.tsx' $EXCLUDES -- lib/ app/ components/; then
            echo "::error::Found document.write() in production code"
            FOUND=1
          fi
          if [ "$FOUND" -ne 0 ]; then
            exit 1
          fi
          echo "No forbidden patterns found ✓"

  # ─── Visual Regression Tests ───────────────────────────────
  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:visual')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Build for visual regression
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder-anon-key'
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
          SUPABASE_SERVICE_ROLE_KEY: 'placeholder-service-key'
          STRIPE_SECRET_KEY: 'sk_test_placeholder'
          STRIPE_WEBHOOK_SECRET: 'whsec_placeholder'
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: 'pk_test_placeholder'
          RESEND_API_KEY: 're_placeholder_dummy'
          NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'

      - name: Run visual regression tests
        run: npx playwright test e2e/visual-regression.spec.ts --update-snapshots
        env:
          E2E_BASE_URL: 'http://localhost:3000'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-results
          path: test-results/
          retention-days: 7
